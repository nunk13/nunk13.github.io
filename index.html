            measurementId: "G-Z8RJ50PNH8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.loadHighScoreFromFirebase = async function() {
            try {
                const dbRef = ref(db);
                const snapshot = await get(child(dbRef, 'highScoreData'));
                if (snapshot.exists()) {
                    return snapshot.val();
                } else {
                    return { score: 0, name: "ANON" };
                }
            } catch (error) {
                console.error("Gagal memuat High Score:", error);
                return { score: 0, name: "ANON" };
            }
        };

        window.saveHighScoreToFirebase = async function(score, name) {
            try {
                await set(ref(db, 'highScoreData'), {
                    score: score,
                    name: name
                });
            } catch (error) {
                console.error("Gagal menyimpan High Score:", error);
            }
        };

            // --- KEMBANG API ---
            let fwParticles = [];
            let fwInterval = null;

            function startFireworks() {
                if(!fwCanvas) return;
                fwCanvas.width = gameArea.clientWidth;
                fwCanvas.height = gameArea.clientHeight;
                stopFireworks();
                
                fwInterval = setInterval(() => {
                    let rx = Math.random() * fwCanvas.width;
                    let ry = Math.random() * (fwCanvas.height * 0.6);
                    createExplosion(rx, ry);
                }, 250);

                animateFireworks();
            }

            function stopFireworks() {
                if(fwInterval) clearInterval(fwInterval);
                fwParticles = [];
                if(fwCtx && fwCanvas) fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
            }

            function createExplosion(x, y) {
                let particleCount = 45;
                let colors = ['#00ffff', '#ff0055', '#ffaa00', '#00ff66', '#ffffff'];
                for(let i = 0; i < particleCount; i++) {
                    let angle = Math.random() * Math.PI * 2;
                    let speed = Math.random() * 5 + 2;
                    fwParticles.push({
                        x: x, y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        alpha: 1,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        size: Math.random() * 3 + 1.5
                    });
                }
            }

            function animateFireworks() {
                if(fwParticles.length === 0 && !fwInterval) return;
                fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);

                for(let i = fwParticles.length - 1; i >= 0; i--) {
                    let p = fwParticles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.05;
                    p.alpha -= 0.015;

                    if(p.alpha <= 0) {
                        fwParticles.splice(i, 1);
                        continue;
                    }

                    fwCtx.save();
                    fwCtx.globalAlpha = p.alpha;
                    fwCtx.fillStyle = p.color;
                    fwCtx.shadowBlur = 6;
                    fwCtx.shadowColor = p.color;
                    fwCtx.beginPath();
                    fwCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    fwCtx.fill();
                    fwCtx.restore();
                }

                if(fwParticles.length > 0 || fwInterval) {
                    requestAnimationFrame(animateFireworks);
                }
            }

            // --- AUDIO GENERATOR ---
            let audioCtx = null;
            let compressorNode = null;

            function initAudio() {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        audioCtx = new AudioContext();
                        compressorNode = audioCtx.createDynamicsCompressor();
                        compressorNode.threshold.setValueAtTime(-12, audioCtx.currentTime);
                        compressorNode.knee.setValueAtTime(30, audioCtx.currentTime);
                        compressorNode.ratio.setValueAtTime(12, audioCtx.currentTime);
                        compressorNode.attack.setValueAtTime(0.003, audioCtx.currentTime);
                        compressorNode.release.setValueAtTime(0.2, audioCtx.currentTime);
                        compressorNode.connect(audioCtx.destination);
                    }
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }

            function playSound(type) {
                if (isMuted || soundVolume <= 0) return;
                initAudio();
                if (!audioCtx) return;

                try {
                    const now = audioCtx.currentTime;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.connect(gain);
                    gain.connect(compressorNode || audioCtx.destination);

                    let baseGain = 1.0;

                    if (type === 'eat') {
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(500, now);
                        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.14);
                        baseGain = 2.2;
                        gain.gain.setValueAtTime(baseGain * soundVolume, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
                        osc.start(now);
                        osc.stop(now + 0.14);
                    } else if (type === 'levelup') {
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(523.25, now); 
                        osc.frequency.setValueAtTime(659.25, now + 0.08); 
                        osc.frequency.setValueAtTime(783.99, now + 0.16); 
                        osc.frequency.setValueAtTime(1046.50, now + 0.24);
                        baseGain = 2.5;
                        gain.gain.setValueAtTime(baseGain * soundVolume, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.38);
                        osc.start(now);
                        osc.stop(now + 0.38);
                    } else if (type === 'gameover') {
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(400, now);
                        osc.frequency.exponentialRampToValueAtTime(60, now + 0.5);
                        baseGain = 2.8;
                        gain.gain.setValueAtTime(baseGain * soundVolume, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                        osc.start(now);
                        osc.stop(now + 0.5);
                    }
                } catch (e) {
                    console.log("Audio Error:", e);
                }
            }

            async function init() {
                canvas = document.getElementById("gameCanvas");
                ctx = canvas.getContext("2d");
                fwCanvas = document.getElementById("fireworksCanvas");
                fwCtx = fwCanvas.getContext("2d");
                gameArea = document.getElementById("game-area");

                settingsModal = document.getElementById("settings-modal");
                volRange = document.getElementById("vol-range");

                snakeColorSelect = document.getElementById("snake-color-select");
                settingsLangSelect = document.getElementById("settings-lang-select");

                closeSettingsBtn = document.getElementById("close-settings-btn");

                sesuaikanUkuran();
                setupEvents();

                let firebasePromise = new Promise((resolve) => {
                    let checkInterval = setInterval(async () => {
                        if (window.loadHighScoreFromFirebase) {
                            clearInterval(checkInterval);
                            let data = await window.loadHighScoreFromFirebase();
                            resolve(data);
                        }
                    }, 100);
                });

                let timeoutPromise = new Promise((resolve) => setTimeout(() => resolve({ score: 0, name: "ANON" }), 2000));
                let hsData = await Promise.race([firebasePromise, timeoutPromise]);

                highScore = hsData.score || 0;
                highScoreHolder = hsData.name || "ANON";

                updateHiScoreDisplay();
                updateUIByLanguage();
                tampilkanAlert("NEON CYBER SNAKE", I18N[currentLang].startMsg, "START");

            function sesuaikanUkuran() {
                if (!gameArea || !canvas) return;
                canvas.width = gameArea.clientWidth;
                canvas.height = gameArea.clientHeight;
                if(fwCanvas) {
                    fwCanvas.width = gameArea.clientWidth;
                    fwCanvas.height = gameArea.clientHeight;
                }
                playWidth = Math.floor((canvas.width - (margin * 2)) / grid) * grid;
                playHeight = Math.floor((canvas.height - (margin * 2)) / grid) * grid;
                startX = Math.floor((playWidth / 2) / grid) * grid + margin;
                startY = Math.floor((playHeight / 2) / grid) * grid + margin;
            }

            function tampilkanAlert(title, message, mode) {
                gameDihentikan = true;
                if(gameLoopTimeout) clearTimeout(gameLoopTimeout);
                statusAlertMode = mode;

                document.getElementById("alert-title").innerText = title;
                document.getElementById("alert-msg").innerText = message;
                
                // PENYESUAIAN TEKS TOMBOL BERDASARKAN MODE
                if (mode === 'GAMEOVER') {
                    alertBtn.innerText = I18N[currentLang].playAgainBtn;
                } else if (mode === 'PAUSE') {
                    alertBtn.innerText = I18N[currentLang].resumeBtn;
                } else {
                    alertBtn.innerText = I18N[currentLang].startBtn;
                }
                
                if (mode === 'START') {
                    nameInput.style.display = "inline-block";
                    startLangSelect.style.display = "inline-block";
                    startLangSelect.value = currentLang;
                    nameInput.focus();
                } else {
                    nameInput.style.display = "none";
                    startLangSelect.style.display = "none";
                }

                // MENAMPILKAN TOMBOL KELUAR SAAT GAMEOVER ATAU PAUSE
                if (mode === 'GAMEOVER' || mode === 'PAUSE') {
                    exitBtn.style.display = "inline-block";
                } else {
                    exitBtn.style.display = "none";
                }

                alertBox.style.display = "block";

            function openSettingsModal() {

                settingsModal.style.display = "block";
            }

            function closeSettingsModal() {
                settingsModal.style.display = "none";
            }

            function setupEvents() {
                startLangSelect.onchange = function() {
                    currentLang = startLangSelect.value;
                    updateUIByLanguage();
                    document.getElementById("alert-msg").innerText = I18N[currentLang].startMsg;
                    alertBtn.innerText = I18N[currentLang].startBtn;
                };

                muteBtn.onclick = function(e) {
                    if(e) e.stopPropagation();
                    initAudio();
                    isMuted = !isMuted;
                    
                    if (isMuted) {
                        muteBtn.innerText = "🔇";
                        soundVolume = 0;
                    } else {
                        muteBtn.innerText = "🔊";
                        soundVolume = (lastActiveVolume > 0) ? lastActiveVolume : 1.0;
                    }
                };

                volRange.oninput = function() {
                    volVal.innerText = volRange.value;
                };

                menuBtn.onclick = function(e) {
                    if(e) e.stopPropagation();
                    initAudio();
                    openSettingsModal();
                };

                saveSettingsBtn.onclick = function(e) {
                    if(e) e.stopPropagation();
                    
                    let prevLang = currentLang;
                    let newVolVal = parseInt(volRange.value);
                    
                    soundVolume = newVolVal / 10;
                    if (soundVolume > 0) {
                        lastActiveVolume = soundVolume;
                        isMuted = false;
                        muteBtn.innerText = "🔊";
                    } else {
                        isMuted = true;
                        muteBtn.innerText = "🔇";
                    }

                    snakeColor = snakeColorSelect.value;
                    currentLang = settingsLangSelect.value;

                    updateUIByLanguage();
                    closeSettingsModal();

                    if (prevLang !== currentLang) {
                        resetGame();
                        tampilkanAlert(I18N[currentLang].startTitle, I18N[currentLang].startMsg, "START");
                    } else {
                        if (alertBox.style.display === "none") {
                            isPaused = false;
                            gameDihentikan = false;
                            main();
                        }
                    }
                };

                closeSettingsBtn.onclick = function(e) {
                    if(e) e.stopPropagation();
                    closeSettingsModal();
                    if (alertBox.style.display === "none") {
                        isPaused = false;
                        gameDihentikan = false;
                        main();
                    }
                };

                alertBtn.onclick = function(e) {
                    if(e) e.stopPropagation();
                    initAudio();

                    if (statusAlertMode === 'START') {
                        let playerInputName = nameInput.value.trim().toUpperCase();
                        currentPlayerName = (playerInputName !== "") ? playerInputName : "PLAYER";
                        currentLang = startLangSelect.value;
                        updateUIByLanguage();
                    }

                    stopFireworks(); 
                    alertBox.style.display = "none";

                    if (statusAlertMode === 'PAUSE') {
                        gameDihentikan = false;
                        isPaused = false;
                        main();
                    } else {
                        resetGame();
                        gameDihentikan = false;
                        isPaused = false;
                        main();
                    }
                };

                exitBtn.onclick = function(e) {
                    if(e) e.stopPropagation();
                    window.location.href = "https://www.google.com";
                };

                window.addEventListener('keydown', function(e) {
                    if (document.activeElement === nameInput || settingsModal.style.display === "block") return;
                    initAudio();
                    
                    if (e.code === "Space") {
                        if (!gameDihentikan && !isPaused) {
                            isPaused = true;
                            // PEMICU IKLAN MONETAG SAAT JEDA / PAUSE VIA KEYBOARD
                            triggerMonetagAd();
                            tampilkanAlert(I18N[currentLang].pauseTitle, I18N[currentLang].pauseMsg, "PAUSE");
                        }
                        return;
                    }

                    if (gameDihentikan || isPaused) return;

                    if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') && arah !== 'BAWAH') arah = 'ATAS';
                    else if ((e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') && arah !== 'ATAS') arah = 'BAWAH';
                    else if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && arah !== 'KANAN') arah = 'KIRI';
                    else if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && arah !== 'KIRI') arah = 'KANAN';
                });

                let touchStartX = 0, touchStartY = 0;

                gameArea.addEventListener('touchstart', function(e) {
                    initAudio();
                    if (settingsModal.style.display === "block" || alertBox.style.display === "block") return;
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                }, {passive: true});

                gameArea.addEventListener('touchend', function(e) {
                    if (settingsModal.style.display === "block" || alertBox.style.display === "block") return;
                    if (e.changedTouches.length === 0) return;

                    let dx = e.changedTouches[0].clientX - touchStartX;
                    let dy = e.changedTouches[0].clientY - touchStartY;
                    let jarak = Math.hypot(dx, dy);

                    if (jarak < 12) {
                        if (!gameDihentikan && !isPaused) {
                            isPaused = true;
                            // PEMICU IKLAN MONETAG SAAT JEDA / PAUSE VIA TAP SCREEN
                            triggerMonetagAd();
                            tampilkanAlert(I18N[currentLang].pauseTitle, I18N[currentLang].pauseMsg, "PAUSE");
                        }
                        return;
                    }

                    if (gameDihentikan || isPaused) return;

                    if (Math.abs(dx) > Math.abs(dy)) {
                        if (dx > 0 && arah !== 'KIRI') arah = 'KANAN';
                        else if (dx < 0 && arah !== 'KANAN') arah = 'KIRI';
                    } else {
                        if (dy > 0 && arah !== 'ATAS') arah = 'BAWAH';
                        else if (dy < 0 && arah !== 'BAWAH') arah = 'ATAS';
                    }
                }, {passive: true});
            }

            function acakMakanan() {
                let kolomMax = Math.max(1, Math.floor(playWidth / grid));
                let barisMax = Math.max(1, Math.floor(playHeight / grid));
                makanan.x = Math.floor(Math.random() * kolomMax) * grid + margin;
                makanan.y = Math.floor(Math.random() * barisMax) * grid + margin;
            }

            function resetGame() {
                sesuaikanUkuran();
                ular = [];
                for(let i=0; i<5; i++) {
                    ular.push({x: startX - (i * grid), y: startY});
                }
                arah = 'KANAN'; 
                totalSkorKumulatif = 0; 
                level = 1; 
                kecepatan = kecepatanAwal; 
                isNewHighScore = false;
                perbaruiInfo(); 
                acakMakanan();
            }

            function perbaruiInfo() {
                let targetLevel = level * 10;
                let formatSkor = totalSkorKumulatif < 10 ? "0" + totalSkorKumulatif : totalSkorKumulatif;
                let formatLvl = level < 10 ? "0" + level : level;
                
                document.getElementById("skor-txt").innerText = "FEED: " + formatSkor + "/" + targetLevel;
                document.getElementById("level-txt").innerText = "LVL: " + formatLvl;
            }

            function main() {
                if (gameDihentikan || isPaused) return;

                gameLoopTimeout = setTimeout(function() {
                    if (gameDihentikan || isPaused) return;

                    let kepalaBaru = {x: ular[0].x, y: ular[0].y};
                    if (arah === 'ATAS') kepalaBaru.y -= grid;
                    if (arah === 'BAWAH') kepalaBaru.y += grid;
                    if (arah === 'KIRI') kepalaBaru.x -= grid;
                    if (arah === 'KANAN') kepalaBaru.x += grid;

                    if (kepalaBaru.x < margin) kepalaBaru.x = playWidth - grid + margin;
                    else if (kepalaBaru.x >= playWidth + margin) kepalaBaru.x = margin;
                    if (kepalaBaru.y < margin) kepalaBaru.y = playHeight - grid + margin;
                    else if (kepalaBaru.y >= playHeight + margin) kepalaBaru.y = margin;

                    // TABRAKAN DIRI (GAME OVER)
                    if (ular.slice(1).some(s => s.x === kepalaBaru.x && s.y === kepalaBaru.y)) {
                        playSound('gameover');
                        
                        // PEMICU IKLAN MONETAG SAAT GAME OVER
                        triggerMonetagAd();

                        const lang = I18N[currentLang];
                        let msg = "";

                        if (isNewHighScore) {
                            msg = lang.newRecordMsg
                                    .replace("{name}", currentPlayerName)
                                    .replace("{score}", totalSkorKumulatif);
                            startFireworks();
                        } else {
                            msg = lang.scoreMsg
                                    .replace("{score}", totalSkorKumulatif)
                                    .replace("{holder}", highScoreHolder)
                                    .replace("{high}", highScore);
                        }
                        tampilkanAlert(lang.gameOverTitle, msg, "GAMEOVER");
                        return;
                    }

                    ular.unshift(kepalaBaru);

                    let foodCX = makanan.x + grid / 2;
                    let foodCY = makanan.y + grid / 2;
                    let headCX = kepalaBaru.x + grid / 2;
                    let headCY = kepalaBaru.y + grid / 2;

                    let jarakEuclidean = Math.hypot(headCX - foodCX, headCY - foodCY);
                    
                    let mauMakan = false;
                    let difX = makanan.x - kepalaBaru.x;
                    let difY = makanan.y - kepalaBaru.y;

                    if (arah === 'KANAN' && difY === 0 && difX > 0 && difX <= grid * 2.5) mauMakan = true;
                    if (arah === 'KIRI' && difY === 0 && difX < 0 && Math.abs(difX) <= grid * 2.5) mauMakan = true;
                    if (arah === 'BAWAH' && difX === 0 && difY > 0 && difY <= grid * 2.5) mauMakan = true;
                    if (arah === 'ATAS' && difX === 0 && difY < 0 && Math.abs(difY) <= grid * 2.5) mauMakan = true;

                    if (jarakEuclidean < grid * 0.85) {
                        totalSkorKumulatif += 1;
                        
                        if (totalSkorKumulatif >= level * 10) {
                            level += 1;
                            kecepatan = Math.max(80, kecepatan - 25);
                            playSound('levelup');
                        } else {
                            playSound('eat');
                        }

                        if (totalSkorKumulatif > highScore) {
                            highScore = totalSkorKumulatif;
                            highScoreHolder = currentPlayerName || "PLAYER";
                            isNewHighScore = true;
                            if (window.saveHighScoreToFirebase) {
                                window.saveHighScoreToFirebase(highScore, highScoreHolder);
                            }
                            updateHiScoreDisplay();
                        }

                        perbaruiInfo();
                        acakMakanan();
                    } else {
                        ular.pop();
                    }

                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    ctx.strokeStyle = 'rgba(0, 255, 255, 0.4)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(margin - 1, margin - 1, playWidth + 2, playHeight + 2);

                    // MAKANAN APEL MERAH
                    ctx.save();
                    ctx.fillStyle = '#ff2244';
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#ff0055';
                    ctx.beginPath();
                    ctx.arc(foodCX, foodCY, grid * 0.45, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = '#000000';
                    ctx.stroke();
                    ctx.restore();

                    const activeColor = COLOR_MAP[snakeColor] || COLOR_MAP.green;

                    // RENDERING BADAN ULAR
                    ctx.save();
                    let totalSeg = ular.length;

                    for (let i = 0; i < totalSeg - 1; i++) {
                        let p1 = {x: ular[i].x + grid/2, y: ular[i].y + grid/2};
                        let p2 = {x: ular[i+1].x + grid/2, y: ular[i+1].y + grid/2};

                        if (Math.abs(p2.x - p1.x) > playWidth / 2 || Math.abs(p2.y - p1.y) > playHeight / 2) {
                            continue;
                        }

                        let w1 = (grid * 0.48) * Math.pow(1 - (i / totalSeg), 0.3);
                        let w2 = (grid * 0.48) * Math.pow(1 - ((i + 1) / totalSeg), 0.3);
                        w1 = Math.max(2, w1);
                        w2 = Math.max(1.5, w2);

                        let dx = p2.x - p1.x;
                        let dy = p2.y - p1.y;
                        let len = Math.hypot(dx, dy);
                        if (len === 0) continue;

                        let nx = -dy / len;
                        let ny = dx / len;

                        ctx.beginPath();
                        ctx.moveTo(p1.x + nx * (w1 + 1), p1.y + ny * (w1 + 1));
                        ctx.lineTo(p2.x + nx * (w2 + 1), p2.y + ny * (w2 + 1));
                        ctx.lineTo(p2.x - nx * (w2 + 1), p2.y - ny * (w2 + 1));
                        ctx.lineTo(p1.x - nx * (w1 + 1), p1.y - ny * (w1 + 1));
                        ctx.closePath();
                        ctx.fillStyle = '#000000';
                        ctx.fill();

                        ctx.beginPath();
                        ctx.moveTo(p1.x + nx * w1, p1.y + ny * w1);
                        ctx.lineTo(p2.x + nx * w2, p2.y + ny * w2);
                        ctx.lineTo(p2.x - nx * w2, p2.y - ny * w2);
                        ctx.lineTo(p1.x - nx * w1, p1.y - ny * w1);
                        ctx.closePath();
                        ctx.fillStyle = activeColor.body;
                        ctx.fill();
                    }

                    for (let i = 1; i < totalSeg; i++) {
                        let pt = {x: ular[i].x + grid/2, y: ular[i].y + grid/2};
                        let r = (grid * 0.48) * Math.pow(1 - (i / totalSeg), 0.3);
                        r = Math.max(1.5, r);

                        ctx.beginPath();
                        ctx.arc(pt.x, pt.y, r + 1, 0, Math.PI * 2);
                        ctx.fillStyle = '#000000';
                        ctx.fill();

                        ctx.beginPath();
                        ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
                        ctx.fillStyle = activeColor.body;
                        ctx.fill();

                        if (i % 2 === 0 && r > 3) {
                            ctx.beginPath();
                            ctx.arc(pt.x, pt.y - (r * 0.2), r * 0.35, 0, Math.PI * 2);
                            ctx.fillStyle = activeColor.dark;
                            ctx.fill();
                        }
                    }
                    ctx.restore();

                    // RENDERING KEPALA ULAR
                    ctx.save();
                    ctx.translate(headCX, headCY);

                    let angle = 0;
                    if (arah === 'KANAN') angle = 0;
                    else if (arah === 'BAWAH') angle = Math.PI / 2;
                    else if (arah === 'KIRI') angle = Math.PI;
                    else if (arah === 'ATAS') angle = -Math.PI / 2;

                    ctx.rotate(angle);

                    let headR = grid * 0.52;

                    if (mauMakan) {
                        let mouthAngle = 0.35 * Math.PI; 

                        ctx.beginPath();
                        ctx.arc(0, 0, headR + 1, mouthAngle, Math.PI * 2 - mouthAngle);
                        ctx.lineTo(headR * 0.2, 0);
                        ctx.closePath();
                        ctx.fillStyle = '#000000';
                        ctx.fill();

                        ctx.beginPath();
                        ctx.arc(0, 0, headR, mouthAngle, Math.PI * 2 - mouthAngle);
                        ctx.lineTo(headR * 0.3, 0);
                        ctx.closePath();
                        ctx.fillStyle = activeColor.body;
                        ctx.fill();

                        ctx.beginPath();
                        ctx.arc(0, 0, headR * 0.85, mouthAngle * 0.9, Math.PI * 2 - (mouthAngle * 0.9));
                        ctx.lineTo(0, 0);
                        ctx.closePath();
                        ctx.fillStyle = '#e63946';
                        ctx.fill();

                        ctx.beginPath();
                        ctx.moveTo(headR * 0.2, 0);
                        ctx.lineTo(headR * 1.3, 0);
                        ctx.lineTo(headR * 1.5, -headR * 0.25);
                        ctx.moveTo(headR * 1.3, 0);
                        ctx.lineTo(headR * 1.5, headR * 0.25);
                        ctx.strokeStyle = '#ff0055';
                        ctx.lineWidth = 1.2;
                        ctx.stroke();

                    } else {
                        ctx.beginPath();
                        ctx.arc(0, 0, headR + 1, 0, Math.PI * 2);
                        ctx.fillStyle = '#000000';
                        ctx.fill();

                        ctx.beginPath();
                        ctx.arc(0, 0, headR, 0, Math.PI * 2);
                        ctx.fillStyle = activeColor.body;
                        ctx.fill();
                    }

                    let eyeOffsetY = headR * 0.42;
                    let eyeOffsetX = headR * 0.22;
                    let eyeR = headR * 0.32;
                    let pupilR = eyeR * 0.5;

                    ctx.beginPath();
                    ctx.arc(eyeOffsetX, -eyeOffsetY, eyeR, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 0.8;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(eyeOffsetX + (mauMakan ? 1.5 : 0.5), -eyeOffsetY, pupilR, 0, Math.PI * 2);
                    ctx.fillStyle = '#000000';
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(eyeOffsetX, eyeOffsetY, eyeR, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 0.8;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(eyeOffsetX + (mauMakan ? 1.5 : 0.5), eyeOffsetY, pupilR, 0, Math.PI * 2);
                    ctx.fillStyle = '#000000';
                    ctx.fill();

                    ctx.restore();

                    main();
                }, kecepatan);
            }

            window.addEventListener('resize', function() {
                sesuaikanUkuran();
            });

            window.onload = init;
        })();
    </script>
</body>
</html>
