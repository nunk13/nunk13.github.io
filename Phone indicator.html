<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER_MINI // Widget</title>
    <style>
        :root {
            --bg-deep: #030712;
            --card-bg: rgba(11, 19, 41, 0.95);
            --cyan-neon: #00f0ff;
            --blue-bright: #38bdf8;
            --text-main: #f0f9ff;
            --text-muted: #64748b;
            --accent-glow: 0 0 10px rgba(0, 240, 255, 0.3);
            --border-cyber: 1px solid rgba(0, 240, 255, 0.25);
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            padding: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .widget-mini {
            width: 100%;
            max-width: 280px;
            background: var(--card-bg);
            border: var(--border-cyber);
            border-radius: 12px;
            padding: 10px;
            box-shadow: var(--accent-glow);
            backdrop-filter: blur(10px);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.15);
        }

        .title {
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            color: var(--cyan-neon);
        }

        .pulse {
            width: 5px;
            height: 5px;
            background-color: var(--cyan-neon);
            border-radius: 50%;
            box-shadow: 0 0 5px var(--cyan-neon);
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 0.2; }
            50% { opacity: 1; }
            100% { opacity: 0.2; }
        }

        .grid-mini {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
        }

        .card {
            background: rgba(3, 7, 18, 0.7);
            border: 1px solid rgba(56, 189, 248, 0.15);
            border-radius: 8px;
            padding: 6px 8px;
        }

        .label {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .value {
            font-size: 0.8rem;
            font-weight: 700;
            margin-top: 2px;
            line-height: 1.2;
        }

        .cyan { color: var(--cyan-neon); }
        .blue { color: var(--blue-bright); }
    </style>
</head>
<body>

<div class="widget-mini">
    <div class="header">
        <span class="title">⚡ CYBER.MON MINI</span>
        <div class="pulse"></div>
    </div>

    <div class="grid-mini">
        <div class="card">
            <div class="label">Baterai</div>
            <div class="value cyan" id="bat-val">--%</div>
        </div>
        <div class="card">
            <div class="label">Suhu Thermal</div>
            <div class="value blue" id="temp-val">--</div>
        </div>
        <div class="card">
            <div class="label">Jaringan</div>
            <div class="value cyan" id="net-val">--</div>
        </div>
        <div class="card">
            <div class="label">RAM</div>
            <div class="value blue" id="ram-val">--</div>
        </div>
    </div>
</div>

<script>
    async function updateMiniWidget() {
        // Jaringan
        const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (conn) {
            let type = conn.effectiveType ? conn.effectiveType.toUpperCase() : 'WIFI';
            if(type === '4G' || type === '3G') document.getElementById('net-val').innerText = type;
            else document.getElementById('net-val').innerText = 'WIFI';
        } else {
            document.getElementById('net-val').innerText = 'WIFI';
        }

        // RAM (Perkiraan Aktif)
        let ram = navigator.deviceMemory ? navigator.deviceMemory : 8;
        document.getElementById('ram-val').innerText = '~' + (ram >= 8 ? '8' : ram) + ' GB';

        // Baterai & Suhu Estimasi Dinamis
        if ('getBattery' in navigator) {
            try {
                const b = await navigator.getBattery();
                const lvl = Math.round(b.level * 100);
                document.getElementById('bat-val').innerText = lvl + '%';
                
                // Logika rentang suhu persis versi awal
                let tempEst = "32°C - 36°C<br><span style='font-size:0.6rem; font-weight:normal;'>(Sejuk)</span>";
                if (b.charging && lvl > 85) tempEst = "38°C - 41°C<br><span style='font-size:0.6rem; font-weight:normal;'>(Hangat)</span>";
                if (b.charging && lvl === 100) tempEst = "35°C<br><span style='font-size:0.6rem; font-weight:normal;'>(Penuh)</span>";
                document.getElementById('temp-val').innerHTML = tempEst;
            } catch(e) {
                document.getElementById('bat-val').innerText = 'OK';
                document.getElementById('temp-val').innerText = '32°C - 36°C';
            }
        } else {
            document.getElementById('bat-val').innerText = 'N/A';
            document.getElementById('temp-val').innerText = '32°C - 36°C';
        }
    }

    updateMiniWidget();
</script>

</body>
</html>
