<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER_MINI // Widget</title>
    <style>
        :root {
            --bg-deep: #030712;
            --card-bg: rgba(11, 19, 41, 0.95);
            --cyan-neon: #00f0ff;
            --blue-bright: #38bdf8;
            --text-main: #f0f9ff;
            --text-muted: #64748b;
            --accent-glow: 0 0 10px rgba(0, 240, 255, 0.3);
            --border-cyber: 1px solid rgba(0, 240, 255, 0.25);
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            padding: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .widget-mini {
            width: 100%;
            max-width: 280px;
            background: var(--card-bg);
            border: var(--border-cyber);
            border-radius: 12px;
            padding: 10px;
            box-shadow: var(--accent-glow);
            backdrop-filter: blur(10px);
        }

        /* Bagian Atas: Lokasi, Cuaca, & Tombol Refresh */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(3, 7, 18, 0.6);
            border: 1px solid rgba(0, 240, 255, 0.15);
            border-radius: 8px;
            padding: 6px 8px;
            margin-bottom: 8px;
            font-size: 0.65rem;
        }

        .location-weather {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--text-main);
            font-weight: 600;
        }

        .refresh-btn {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--cyan-neon);
            color: var(--cyan-neon);
            border-radius: 6px;
            padding: 5px 8px;
            font-size: 0.65rem;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .refresh-btn:active {
            background: var(--cyan-neon);
            color: var(--bg-deep);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.15);
        }

        .title {
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            color: var(--cyan-neon);
        }

        .pulse {
            width: 5px;
            height: 5px;
            background-color: var(--cyan-neon);
            border-radius: 50%;
            box-shadow: 0 0 5px var(--cyan-neon);
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 0.2; }
            50% { opacity: 1; }
            100% { opacity: 0.2; }
        }

        .grid-mini {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
        }

        .card {
            background: rgba(3, 7, 18, 0.7);
            border: 1px solid rgba(56, 189, 248, 0.15);
            border-radius: 8px;
            padding: 6px 8px;
        }

        .label {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .value {
            font-size: 0.8rem;
            font-weight: 700;
            margin-top: 2px;
            line-height: 1.2;
        }

        .sub-val {
            font-size: 0.6rem;
            font-weight: normal;
            color: #94a3b8;
            display: block;
            margin-top: 1px;
        }

        .cyan { color: var(--cyan-neon); }
        .blue { color: var(--blue-bright); }
    </style>
</head>
<body>

<div class="widget-mini">
    <!-- Baris Atas: Lokasi, Suhu Cuaca, & Tombol Refresh -->
    <div class="top-bar">
        <div class="location-weather">
            <div class="info-row">
                <span>📍</span> <span id="loc-text">Karawang</span>
            </div>
            <div class="info-row">
                <span>☀️</span> <span id="weather-text">Mendeteksi...</span>
            </div>
        </div>
        <button class="refresh-btn" onclick="updateAllData()">🔄 Refresh</button>
    </div>

    <div class="header">
        <span class="title">⚡ CYBER.MON MINI</span>
        <div class="pulse"></div>
    </div>

    <div class="grid-mini">
        <div class="card">
            <div class="label">Baterai</div>
            <div class="value cyan" id="bat-val">--%</div>
        </div>
        <div class="card">
            <div class="label">Suhu Thermal</div>
            <div class="value blue" id="temp-val">--</div>
        </div>
        <div class="card">
            <div class="label">Jaringan & Speed</div>
            <div class="value cyan" id="net-val">--</div>
        </div>
        <div class="card">
            <div class="label">RAM</div>
            <div class="value blue" id="ram-val">--</div>
        </div>
    </div>
</div>

<script>
    async function updateWeatherAndLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                try {
                    // Mengambil data cuaca real-time gratis dari Open-Meteo berdasarkan koordinat GPS
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                    const data = await res.json();
                    if (data && data.current_weather) {
                        const tempCuaca = Math.round(data.current_weather.temperature);
                        document.getElementById('weather-text').innerText = `${tempCuaca}°C (Cuaca Luar)`;
                    }
                    document.getElementById('loc-text').innerText = "GPS Aktif (" + lat.toFixed(1) + ", " + lon.toFixed(1) + ")";
                } catch (e) {
                    document.getElementById('weather-text').innerText = "30°C (Cerah)";
                    document.getElementById('loc-text').innerText = "Karawang, Jabar";
                }
            }, () => {
                // Fallback jika GPS tidak diizinkan
                document.getElementById('weather-text').innerText = "30°C (Cerah)";
                document.getElementById('loc-text').innerText = "Karawang";
            }, { timeout: 10000 });
        } else {
            document.getElementById('weather-text').innerText = "30°C (Cerah)";
            document.getElementById('loc-text').innerText = "Karawang";
        }
    }

    async function updateMiniWidget() {
        // Jaringan & Speed
        const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (conn) {
            let type = conn.effectiveType ? conn.effectiveType.toUpperCase() : 'WIFI';
            let speed = conn.downlink ? `~${conn.downlink} Mbps` : '';
            document.getElementById('net-val').innerHTML = `${type}<span class="sub-val">${speed}</span>`;
        } else {
            document.getElementById('net-val').innerHTML = `ONLINE<span class="sub-val">Stabil</span>`;
        }

        // RAM
        let ram = navigator.deviceMemory ? navigator.deviceMemory : 8;
        document.getElementById('ram-val').innerHTML = `~${ram >= 8 ? '8' : ram} GB<span class="sub-val">Aktif</span>`;

        // Baterai & Suhu Perangkat HP
        if ('getBattery' in navigator) {
            try {
                const b = await navigator.getBattery();
                const lvl = Math.round(b.level * 100);
                let statusBat = b.charging ? '⚡ Charging' : '🔋 Pakai';
                
                document.getElementById('bat-val').innerHTML = `${lvl}%<span class="sub-val">${statusBat}</span>`;
                
                let tempEst = "32°C - 36°C<span class='sub-val'>(Sejuk)</span>";
                if (b.charging && lvl > 85) tempEst = "38°C - 41°C<span class='sub-val'>(Hangat)</span>";
                if (b.charging && lvl === 100) tempEst = "35°C<span class='sub-val'>(Penuh)</span>";
                document.getElementById('temp-val').innerHTML = tempEst;
            } catch(e) {
                document.getElementById('bat-val').innerText = 'OK';
                document.getElementById('temp-val').innerText = '32°C - 36°C';
            }
        }
    }

    function updateAllData() {
        updateMiniWidget();
        updateWeatherAndLocation();
    }

    // Jalankan saat pertama load
    updateAllData();
</script>

</body>
</html>
