<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER_OS // 5.0 Widget</title>
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,{
        %22name%22: %22Cyber Device Widget%22,
        %22short_name%22: %22CyberWidget%22,
        %22start_url%22: %22.%22,
        %22display%22: %22standalone%22,
        %22background_color%22: %22%23030712%22,
        %22theme_color%22: %22%2300f0ff%22
    }">
    <style>
        :root {
            --bg-deep: #030712;
            --card-bg: rgba(11, 19, 41, 0.85);
            --cyan-neon: #00f0ff;
            --blue-bright: #38bdf8;
            --text-main: #f0f9ff;
            --text-muted: #64748b;
            --accent-glow: 0 0 12px rgba(0, 240, 255, 0.35);
            --border-cyber: 1px solid rgba(0, 240, 255, 0.25);
        }

        body {
            font-family: 'SF Pro Display', -apple-system, system-ui, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Ukuran Widget Kecil / Kompak */
        .widget-container {
            width: 100%;
            max-width: 360px;
            background: var(--card-bg);
            border: var(--border-cyber);
            border-radius: 16px;
            padding: 14px;
            box-shadow: var(--accent-glow), inset 0 0 15px rgba(56, 189, 248, 0.05);
            backdrop-filter: blur(12px);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 240, 255, 0.15);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .title {
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 0.15em;
            color: var(--cyan-neon);
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.65rem;
            color: var(--blue-bright);
            background: rgba(0, 240, 255, 0.1);
            padding: 2px 8px;
            border-radius: 20px;
            border: 1px solid rgba(0, 240, 255, 0.3);
        }

        .pulse {
            width: 6px;
            height: 6px;
            background-color: var(--cyan-neon);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--cyan-neon);
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 0.2; }
            50% { opacity: 1; }
            100% { opacity: 0.2; }
        }

        .grid-mini {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 8px;
        }

        .metric-card {
            background: rgba(3, 7, 18, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.15);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .metric-card.full {
            grid-column: span 2;
        }

        .label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .value.cyan { color: var(--cyan-neon); text-shadow: 0 0 6px rgba(0,240,255,0.3); }
        .value.blue { color: var(--blue-bright); }

        .sub-text {
            font-size: 0.65rem;
            color: #94a3b8;
            margin-top: 2px;
        }

        .sys-info {
            font-size: 0.7rem;
            line-height: 1.4;
            color: #cbd5e1;
            font-family: monospace;
        }

        .refresh-cyber {
            width: 100%;
            background: linear-gradient(90deg, rgba(0,240,255,0.1), rgba(56,189,248,0.2));
            border: 1px solid var(--cyan-neon);
            color: var(--cyan-neon);
            padding: 8px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            margin-top: 4px;
        }

        .refresh-cyber:active {
            background: var(--cyan-neon);
            color: var(--bg-deep);
        }
    </style>
</head>
<body>

<div class="widget-container">
    <div class="header">
        <span class="title">⚡ CYBER.MON // 5.0</span>
        <div class="live-badge">
            <div class="pulse"></div>
            <span>ONLINE</span>
        </div>
    </div>

    <div class="grid-mini">
        <!-- Baterai -->
        <div class="metric-card">
            <div class="label">Baterai</div>
            <div class="value cyan" id="bat-val">--%</div>
            <div class="sub-text" id="bat-status">Menganalisis...</div>
        </div>

        <!-- Suhu Thermal -->
        <div class="metric-card">
            <div class="label">Suhu Thermal</div>
            <div class="value blue" id="temp-val">Normal</div>
            <div class="sub-text">Estimasi CPU</div>
        </div>

        <!-- Jaringan -->
        <div class="metric-card">
            <div class="label">Jaringan</div>
            <div class="value cyan" id="net-val">--</div>
            <div class="sub-text" id="net-speed">Downlink: --</div>
        </div>

        <!-- RAM -->
        <div class="metric-card">
            <div class="label">RAM Sistem</div>
            <div class="value blue" id="ram-val">--</div>
            <div class="sub-text">API Browser Cap</div>
        </div>

        <!-- Detail OS & Layar -->
        <div class="metric-card full">
            <div class="label">Device Specs</div>
            <div class="sys-info" id="sys-specs">Memuat parameter hardware...</div>
        </div>
    </div>

    <button class="refresh-cyber" onclick="loadTelemetry()">Sync Telemetry</button>
</div>

<script>
    async function loadTelemetry() {
        // 1. Baterai
        if ('getBattery' in navigator) {
            try {
                const b = await navigator.getBattery();
                const lvl = Math.round(b.level * 100);
                document.getElementById('bat-val').innerText = lvl + '%';
                let st = b.charging ? '⚡ Mengisi' : '🔋 Disetrum';
                document.getElementById('bat-status').innerText = st;
            } catch(e) {
                document.getElementById('bat-val').innerText = 'N/A';
            }
        }

        // 2. Jaringan & Wi-Fi Check
        const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (conn) {
            let netType = conn.type ? conn.type.toUpperCase() : (conn.effectiveType ? conn.effectiveType.toUpperCase() : 'ONLINE');
            // Jika terdeteksi connection type khusus atau efektif 4g/wifi
            document.getElementById('net-val').innerText = netType;
            document.getElementById('net-speed').innerText = `~${conn.downlink || '?'} Mbps (${conn.rtt || '?'}ms)`;
        } else {
            document.getElementById('net-val').innerText = 'WIFI / DATA';
            document.getElementById('net-speed').innerText = 'Stabil';
        }

        // 3. RAM (Mengatasi pembatasan max 8GB browser, menampilkan catatan atau info mendekati)
        let ramRaw = navigator.deviceMemory ? navigator.deviceMemory : '?';
        // Karena browser nge-cap di 8GB untuk HP ber-RAM besar, kita tampilkan info aslinya atau catatan
        document.getElementById('ram-val').innerText = ramRaw >= 8 ? '8+ GB (Max API)' : ramRaw + ' GB';

        // 4. Deteksi OS & Versi Android yang Akurat dari User-Agent
        const ua = navigator.userAgent;
        let androidVersion = "Unknown";
        let match = ua.match(/Android\s([0-9\.]+)/);
        if (match) {
            androidVersion = "Android " + match.1;
        } else if (ua.indexOf("iPhone") !== -1 || ua.indexOf("iPad") !== -1) {
            androidVersion = "iOS Apple";
        }

        // Ambil brand/model singkat jika terbaca di UA
        let deviceModel = "Mobile Device";
        if (ua.indexOf("Oppo") !== -1 || ua.indexOf("CPH") !== -1) deviceModel = "Oppo Series";
        else if (ua.indexOf("Infinix") !== -1) deviceModel = "Infinix Series";

        document.getElementById('sys-specs').innerHTML = `
            <b>OS:</b> ${androidVersion}<br>
            <b>Resolusi:</b> ${window.screen.width}x${window.screen.height} px<br>
            <b>User-Agent:</b> <span style="color:var(--cyan-neon)">${deviceModel}</span>
        `;
    }

    loadTelemetry();
    setInterval(loadTelemetry, 8000);
</script>

</body>
</html>
