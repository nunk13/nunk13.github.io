<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Indicator Widget</title>
    <style>
        :root {
            --bg-deep: #030712;
            --card-bg: rgba(11, 19, 41, 0.95);
            --cyan-neon: #00f0ff;
            --blue-bright: #38bdf8;
            --text-main: #f0f9ff;
            --text-muted: #64748b;
            --accent-glow: 0 0 14px rgba(0, 240, 255, 0.4);
            --border-cyber: 1px solid rgba(0, 240, 255, 0.3);
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Lebar dimaksimalkan menyesuaikan layar HP */
        .widget-mini {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: var(--border-cyber);
            border-radius: 16px;
            padding: 12px;
            box-shadow: var(--accent-glow);
            backdrop-filter: blur(12px);
        }

        /* Baris Atas: Horizontal Sejajar (Lokasi, Cuaca, & Tombol Refresh Panah Berputar) */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(3, 7, 18, 0.75);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 10px;
            padding: 8px 12px;
            margin-bottom: 10px;
            font-size: 0.7rem;
            gap: 8px;
        }

        .location-weather-horizontal {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--text-main);
            font-weight: 600;
        }

        /* Tombol Refresh Ikon Panah Putar dengan Efek Glowing */
        .refresh-btn {
            background: rgba(0, 240, 255, 0.12);
            border: 1px solid var(--cyan-neon);
            color: var(--cyan-neon);
            border-radius: 8px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .refresh-btn svg {
            transition: transform 0.5s ease;
        }

        .refresh-btn:active svg {
            transform: rotate(360deg);
        }

        .refresh-btn:active {
            background: var(--cyan-neon);
            color: var(--bg-deep);
            box-shadow: 0 0 14px var(--cyan-neon);
        }

        .grid-mini {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .card {
            background: rgba(3, 7, 18, 0.7);
            border: 1px solid rgba(56, 189, 248, 0.18);
            border-radius: 10px;
            padding: 8px 10px;
        }

        .label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .value {
            font-size: 0.9rem;
            font-weight: 700;
            margin-top: 3px;
            line-height: 1.2;
        }

        .sub-val {
            font-size: 0.65rem;
            font-weight: normal;
            color: #94a3b8;
            display: block;
            margin-top: 2px;
        }

        .cyan { color: var(--cyan-neon); text-shadow: 0 0 5px rgba(0,240,255,0.3); }
        .blue { color: var(--blue-bright); }
    </style>
</head>
<body>

<div class="widget-mini">
    <!-- Baris Atas: Lokasi & Suhu Cuaca Horizontal + Tombol Refresh Panah Glowing -->
    <div class="top-bar">
        <div class="location-weather-horizontal">
            <div class="info-item">
                <span>📍</span> <span id="loc-text">Majalaya</span>
            </div>
            <div class="info-item">
                <span>☀️</span> <span id="weather-text">--°C</span>
            </div>
        </div>
        <button class="refresh-btn" onclick="updateAllData()" title="Refresh">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.63-5.05"/>
            </svg>
        </button>
    </div>

    <!-- 4 Kotak Indikator Utama -->
    <div class="grid-mini">
        <div class="card">
            <div class="label">Baterai</div>
            <div class="value cyan" id="bat-val">--%</div>
        </div>
        <div class="card">
            <div class="label">Suhu Thermal</div>
            <div class="value blue" id="temp-val">--</div>
        </div>
        <div class="card">
            <div class="label">Jaringan & Speed</div>
            <div class="value cyan" id="net-val">--</div>
        </div>
        <div class="card">
            <div class="label">RAM Sistem</div>
            <div class="value blue" id="ram-val">--</div>
        </div>
    </div>
</div>

<script>
    async function updateWeatherAndLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                
                try {
                    // Ambil nama daerah otomatis (seperti Majalaya)
                    const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=14`);
                    const geoData = await geoRes.json();
                    if (geoData && geoData.address) {
                        const area = geoData.address.suburb || geoData.address.village || geoData.address.town || geoData.address.city || "Majalaya";
                        document.getElementById('loc-text').innerText = area;
                    } else {
                        document.getElementById('loc-text').innerText = "Majalaya";
                    }

                    // Ambil suhu cuaca luar berdasarkan koordinat GPS
                    const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                    const weatherData = await weatherRes.json();
                    if (weatherData && weatherData.current_weather) {
                        const tempCuaca = Math.round(weatherData.current_weather.temperature);
                        document.getElementById('weather-text').innerText = `${tempCuaca}°C`;
                    }
                } catch (e) {
                    document.getElementById('loc-text').innerText = "Majalaya";
                    document.getElementById('weather-text').innerText = "30°C";
                }
            }, () => {
                document.getElementById('loc-text').innerText = "Majalaya";
                document.getElementById('weather-text').innerText = "30°C";
            }, { timeout: 10000 });
        } else {
            document.getElementById('loc-text').innerText = "Majalaya";
            document.getElementById('weather-text').innerText = "30°C";
        }
    }

    async function updateMiniWidget() {
        // Jaringan & Speed
        const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (conn) {
            let type = conn.effectiveType ? conn.effectiveType.toUpperCase() : 'WIFI';
            let speed = conn.downlink ? `~${conn.downlink} Mbps` : '';
            document.getElementById('net-val').innerHTML = `${type}<span class="sub-val">${speed}</span>`;
        } else {
            document.getElementById('net-val').innerHTML = `ONLINE<span class="sub-val">Stabil</span>`;
        }

        // RAM
        let ram = navigator.deviceMemory ? navigator.deviceMemory : 8;
        document.getElementById('ram-val').innerHTML = `~${ram >= 8 ? '8' : ram} GB<span class="sub-val">Aktif</span>`;

        // Baterai & Suhu Perangkat
        if ('getBattery' in navigator) {
            try {
                const b = await navigator.getBattery();
                const lvl = Math.round(b.level * 100);
                let statusBat = b.charging ? '⚡ Charging' : '🔋 Pakai';
                
                document.getElementById('bat-val').innerHTML = `${lvl}%<span class="sub-val">${statusBat}</span>`;
                
                let tempEst = "32°C - 36°C<span class='sub-val'>(Sejuk)</span>";
                if (b.charging && lvl > 85) tempEst = "38°C - 41°C<span class='sub-val'>(Hangat)</span>";
                if (b.charging && lvl === 100) tempEst = "35°C<span class='sub-val'>(Penuh)</span>";
                document.getElementById('temp-val').innerHTML = tempEst;
            } catch(e) {
                document.getElementById('bat-val').innerText = 'OK';
                document.getElementById('temp-val').innerText = '32°C - 36°C';
            }
        }
    }

    function updateAllData() {
        updateMiniWidget();
        updateWeatherAndLocation();
    }

    updateAllData();
</script>

</body>
</html>

    }

    updateAllData();
</script>

</body>
</html>
